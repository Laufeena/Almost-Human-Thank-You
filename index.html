<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#21182e" />
  <meta name="description" content="A thank-you card and keepsake for Almost Human, from Laufeena." />
  <title>For Almost Human — With Love, Laufeena</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Georgia, "Times New Roman", serif;
      --gold: #f1c985;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #fff3dc;
      background: radial-gradient(ellipse at 55% -5%, #473158 0%, #241a38 44%, #110e1d 100%);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .46;
      background-image:
        radial-gradient(#f8d79b 1px, transparent 1px),
        radial-gradient(#e4cafa 1px, transparent 1px);
      background-size: 126px 128px, 183px 213px;
      background-position: 23px 15px, 72px 88px;
    }
    main {
      position: relative;
      width: min(1050px, calc(100% - 28px));
      margin: 0 auto;
      padding: clamp(22px, 5vw, 55px) 0 60px;
      text-align: center;
    }
    .eyebrow {
      font: 600 12px/1.5 system-ui, sans-serif;
      text-transform: uppercase;
      letter-spacing: .3em;
      color: #edc489;
      margin: 0 0 16px;
    }
    h1 {
      font-size: clamp(31px, 5.2vw, 58px);
      font-weight: normal;
      line-height: 1.15;
      margin: 0 0 13px;
      color: #ffe1a9;
      text-shadow: 0 0 24px #c48c6c47;
    }
    .subtitle {
      font-size: 17px;
      line-height: 1.6;
      color: #e2d2e5;
      max-width: 700px;
      margin: 0 auto 30px;
    }
    .stage {
      position: relative;
      padding: 9px;
      background: linear-gradient(130deg, #e8c17a, #80654b 35%, #e4cc9c 68%, #ac784e);
      border-radius: 19px;
      box-shadow: 0 24px 80px #0008, 0 0 35px #eabc7940;
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 78vh;
      aspect-ratio: 1440 / 1020;
      object-fit: contain;
      background: #100e1d;
      border-radius: 11px;
    }
    .hint {
      font: 14px/1.8 system-ui, sans-serif;
      color: #eadccc;
      margin: 18px auto 0;
    }
    #finalGift { display: none; }
    #finalGift.visible {
      display: flex;
      min-height: calc(100vh - 115px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn .9s ease both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .artwork {
      display: block;
      width: min(100%, 530px);
      max-height: 70vh;
      object-fit: contain;
      margin: 0 auto 22px;
      filter: drop-shadow(0 15px 45px #0008);
    }
    .gift-caption {
      color: var(--gold);
      font-size: clamp(22px, 3vw, 32px);
      margin: 0 0 18px;
      font-weight: normal;
    }
    .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 51px;
      padding: 14px 25px;
      background: linear-gradient(145deg, #ffdf9f, #e5ac65);
      border: 0;
      border-radius: 999px;
      color: #352538;
      text-decoration: none;
      font: 700 15px/1.3 system-ui, sans-serif;
      box-shadow: 0 7px 26px #eac17b47;
    }
    .download:hover, .download:focus-visible { filter: brightness(1.08); }
    .replay {
      display: block;
      margin: 20px auto 0;
      padding: 9px 15px;
      background: none;
      border: 1px solid #a78a89;
      border-radius: 999px;
      color: #e9d7e7;
      cursor: pointer;
      font: 14px system-ui, sans-serif;
    }
    .replay:hover, .replay:focus-visible { border-color: var(--gold); }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation-duration: .001s !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main>
    <!-- The animation contains the cover, Azu, handwritten reveal, Lau,
         Lauf(e)ena's message, the heart, confetti/pop and the final image. -->
    <section id="cardSection" aria-label="Animated thank-you card">
      <p class="eyebrow">A card from the heart</p>
      <h1>For Almost Human ✧</h1>
      <p class="subtitle">
        A small thank-you, made with love. Watch until the end to reveal
        a special piece of artwork you can keep.
      </p>
      <div class="stage">
        <video id="cardVideo" controls playsinline preload="metadata"
               poster="cover_preview.jpg"
               aria-label="Animated thank-you card for Almost Human">
          <source src="Thank_You_Animation.mp4" type="video/mp4" />
          Your browser does not support HTML5 video.
        </video>
      </div>
      <p class="hint" id="status" role="status" aria-live="polite">
        Press play to open your card. Turn your sound on for the little surprise!
      </p>
    </section>

    <!-- This section is hidden until the video finishes. -->
    <section id="finalGift" aria-label="Your artwork gift" aria-hidden="true">
      <img class="artwork" src="Almost_Human_Artwork.png"
           alt="Almost Human singing under a warm golden spotlight" />
      <h2 class="gift-caption">This is for you! ♡</h2>
      <a class="download" href="Almost_Human_Artwork.png"
         download="Almost_Human_Artwork.png">♡ Download your artwork</a>
      <button id="replayButton" class="replay" type="button">
        ↻ Watch the card again
      </button>
    </section>
  </main>

  <script>
    const video = document.getElementById('cardVideo');
    const cardSection = document.getElementById('cardSection');
    const finalGift = document.getElementById('finalGift');
    const status = document.getElementById('status');
    const replayButton = document.getElementById('replayButton');

    // Reveal the original PNG (and its download link) after the MP4 ends.
    video.addEventListener('ended', () => {
      video.pause();
      cardSection.hidden = true;
      finalGift.classList.add('visible');
      finalGift.setAttribute('aria-hidden', 'false');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    video.addEventListener('error', () => {
      status.textContent = 'The video could not load. Check that Thank_You_Animation.mp4 is uploaded beside index.html.';
    });

    replayButton.addEventListener('click', () => {
      finalGift.classList.remove('visible');
      finalGift.setAttribute('aria-hidden', 'true');
      cardSection.hidden = false;
      video.currentTime = 0;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      video.play().catch(() => {
        status.textContent = 'Press play to restart the card.';
      });
    });
  </script>
</body>
</html>
